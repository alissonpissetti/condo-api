# Deploy automático no push (main/master).
# Na VPS: DEPLOY_PATH = pasta do clone deste repositório (raiz, não subpasta).
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Opcional: DEPLOY_PORT (22)

name: Deploy API

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: condo-api-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build API (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t condo-api:ci .

  deploy:
    name: Deploy API na VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git pull + compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BRANCH,SHA,DEPLOY_PATH
          script: |
            set -euo pipefail
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERRO: DEPLOY_PATH deve ser a raiz do clone deste repo ($DEPLOY_PATH)"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            if [ ! -f docker-compose.prod.yml ]; then
              echo "ERRO: docker-compose.prod.yml ausente no repositório"
              exit 1
            fi
            export IMAGE_TAG="${SHA:0:7}"
            echo ">>> Build API (tag ${IMAGE_TAG})"
            docker compose -f docker-compose.prod.yml build api
            echo ">>> Subindo API"
            docker compose -f docker-compose.prod.yml up -d api --remove-orphans
            docker compose -f docker-compose.prod.yml ps api
            docker image prune -f
